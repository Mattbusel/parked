## Parked, XcodeGen project spec. The .xcodeproj is generated in CI, never committed.
name: Parked
options:
  bundleIdPrefix: com.mattbusel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Parked:
    type: application
    platform: iOS
    dependencies:
      - target: ParkedLive
    sources:
      - path: Sources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.parked
        PRODUCT_NAME: Parked
        INFOPLIST_KEY_CFBundleDisplayName: Parked
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: "${APP_PROFILE}"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Parked
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Parked saves the spot where you left the car and shows the walk back to it. Your location never leaves the phone."
        NSCameraUsageDescription: "Parked uses the camera to photograph the parking sign, meter or garage level so you remember it."
        NSSupportsLiveActivities: true
  ParkedLive:
    type: app-extension
    platform: iOS
    sources:
      - path: Live
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.parked.live
        PRODUCT_NAME: ParkedLive
        PROVISIONING_PROFILE_SPECIFIER: "${EXT_PROFILE}"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Live/Info.plist
      properties:
        CFBundleDisplayName: Parked
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Parked:
    build:
      targets:
        Parked: all
    run:
      config: Debug
    archive:
      config: Release
